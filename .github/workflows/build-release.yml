name: Build EXE + Installer

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Job 1 validating run start
        run: echo "Job 1 validating run start"

      - name: Echo if-condition result
        run: |
          MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $MSG"
          if [[ "$MSG" =~ ^[Pp][Aa][Tt][Cc][Hh] ]] || [[ "$MSG" =~ ^[Mm][Ii][Nn][Oo][Rr] ]] || [[ "$MSG" =~ ^[Mm][Aa][Jj][Oo][Rr] ]]; then
            echo "if-condition result: TRUE - build job will run"
          else
            echo "if-condition result: FALSE - build job will be skipped"
          fi

  build:
    needs: debug
    # Only run when commit message starts with patch|minor|major
    if: "startsWith(github.event.head_commit.message, 'patch') || startsWith(github.event.head_commit.message, 'minor') || startsWith(github.event.head_commit.message, 'major')"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TOML dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: Bump version in pyproject.toml
        id: bump
        shell: pwsh
        run: |
          $msg = "${{ github.event.head_commit.message }}".Trim()
          $kind = $msg.Split(" ")[0].ToLower()
          $env:KIND = $kind
          python .github/scripts/bump_version.py

      - name: Read bumped version
        id: version
        shell: pwsh
        run: |
          python .github/scripts/read_version.py
          $v = (Get-Content version.txt -Raw).Trim()
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          $diff = git diff --cached --name-only
          if ($diff) {
            git commit -m "ci: bump version to ${{ steps.version.outputs.value }} [skip ci]"
            git push
          }

      - name: Run build script
        shell: pwsh
        run: |
          ./build.ps1

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl_ctl-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl_ctl-installer
          path: |
            dist/*installer*
            dist/*setup*
            dist/*.msi
          if-no-files-found: warn

      - name: Create Git tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          git fetch --tags
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.msi
            dist/*installer*
            dist/*setup*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

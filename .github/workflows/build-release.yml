name: Build EXE + Installer

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    # Only run when commit message starts with patch|minor|major
    if: |
      startsWith(github.event.head_commit.message, 'patch') ||
      startsWith(github.event.head_commit.message, 'minor') ||
      startsWith(github.event.head_commit.message, 'major')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TOML dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: Bump version in pyproject.toml
        id: bump
        shell: pwsh
        run: |
          $msg = "${{ github.event.head_commit.message }}".Trim()
          $kind = $msg.Split(" ")[0].ToLower()
          $env:KIND = $kind

          python - <<'PY'
          import toml, os, re

          kind = os.environ["KIND"]
          path = "pyproject.toml"

          data = toml.load(path)

          # Try common locations for version
          version = None
          loc = None
          if "project" in data and "version" in data["project"]:
              version = data["project"]["version"]
              loc = ("project", "version")
          elif "tool" in data and "poetry" in data["tool"] and "version" in data["tool"]["poetry"]:
              version = data["tool"]["poetry"]["version"]
              loc = ("tool", "poetry", "version")
          else:
              raise SystemExit("Could not find version in pyproject.toml")

          m = re.match(r"^(\d+)\.(\d+)\.(\d+)$", str(version).strip())
          if not m:
              raise SystemExit(f"Unsupported version format: {version} (expected x.y.z)")

          major, minor, patch = map(int, m.groups())

          if kind == "patch":
              patch += 1
          elif kind == "minor":
              minor += 1
              patch = 0
          elif kind == "major":
              major += 1
              minor = 0
              patch = 0
          else:
              raise SystemExit(f"Unsupported bump type: {kind}")

          newv = f"{major}.{minor}.{patch}"

          if loc == ("project", "version"):
              data["project"]["version"] = newv
          elif loc == ("tool", "poetry", "version"):
              data["tool"]["poetry"]["version"] = newv

          with open(path, "w", encoding="utf-8") as f:
              toml.dump(data, f)

          print(newv)
          PY

      - name: Read bumped version
        id: version
        shell: pwsh
        run: |
          python - <<'PY'
          import toml
          d = toml.load("pyproject.toml")
          v = (d.get("project") or {}).get("version") or (d.get("tool") or {}).get("poetry", {}).get("version")
          if not v:
              raise SystemExit("Version not found in pyproject.toml")
          with open("version.txt", "w", encoding="utf-8") as f:
              f.write(str(v).strip())
          print(v)
          PY
          $v = (Get-Content version.txt -Raw).Trim()
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          $diff = git diff --cached --name-only
          if ($diff) {
            git commit -m "ci: bump version to ${{ steps.version.outputs.value }} [skip ci]"
            git push
          }

      - name: Run build script
        shell: pwsh
        run: |
          ./build.ps1

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl_ctl-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl_ctl-installer
          path: |
            dist/*installer*
            dist/*setup*
            dist/*.msi
          if-no-files-found: warn

      - name: Create Git tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          git fetch --tags
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.msi
            dist/*installer*
            dist/*setup*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

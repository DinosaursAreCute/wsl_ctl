[project]
name = "wsl_ctl"
version = "0.2.6"
description = "WSL Controller Menu"
readme = "README.md"
requires-python = ">=3.11"
keywords = [ "wsl", "cli", "menu", "windows",]
classifiers = [ "Environment :: Console", "Intended Audience :: System Administrators", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3.11", "Topic :: System :: Systems Administration",]
dependencies = [ "colorama>=0.4.6",]
[[project.authors]]
name = "DinosaursAreCute"

[build-system]
requires = [ "setuptools>=68",]
build-backend = "setuptools.build_meta"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [ "pyinstaller>=6.3", "ruff>=0.4", "mypy>=1.9", "pytest>=8.0",]

[project.scripts]
udmctl = "src.main:main"

[tool.setuptools]
packages = [ "src", "src.ioHelper", "src.Utils", "src.wsl_handler",]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "B", "UP", "SIM", "RET",]
ignore = [ "E501",]

[tool.pytest.ini_options]
testpaths = [ "tests",]
